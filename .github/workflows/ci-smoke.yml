name: CI smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'cursor/**']

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: pip install requests
      - name: E2E smoke
        run: ./tests/e2e_smoke.sh
      - name: Security smoke (QA&VAPT)
        run: ./scripts/security-smoke.sh
      - name: Pricing funnel truth (CBO)
        run: ./scripts/check-pricing-truth.sh
      - name: Funnel CTA utm tags (CBO)
        run: ./scripts/check-funnel-ctas.sh
      - name: Plan intent routing (Sales)
        run: ./scripts/check-plan-intent.sh
      - name: SEO content (how-it-works, pricing)
        run: ./scripts/check-seo-content.sh
      - name: Worker Docker image builds
        run: docker build -t zengtrade-worker:ci saas/worker
