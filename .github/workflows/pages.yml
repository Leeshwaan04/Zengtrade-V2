name: Deploy zengtrade to GitHub Pages

# Builds the static site (marketing + coin pSEO + bundled auth app) with build.py and publishes it.
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".
#
# Session 220: a plain code push (e.g. a one-line CSS fix) used to cost the same 15-19 minutes as
# a 190-coin roster expansion, because seo/generate.py's fetch_coins() re-ran ~1360 sequential,
# deliberately-paced Binance klines calls on EVERY build regardless of whether market data needed
# refreshing. The `schedule` trigger below + the cache restore/save steps decouple that: only a
# scheduled (or manually dispatched) run pays the live-fetch cost and refreshes
# seo/coin_data_cache.json; a normal push restores the most recent cache and skips straight to a
# fast build. Nothing is committed to git for this (would bloat repo history with a file that
# changes every 6h) - it lives entirely in the GitHub Actions cache, keyed by run id with a
# restore-keys prefix so "most recent" always resolves. If the cache is ever missing entirely,
# generate.py's get_coin_data() falls back to a live fetch on its own - never a hard dependency.
on:
  push:
    branches: [main]
  schedule:
    - cron: '20 */6 * * *'   # refresh coin data every 6h, offset from health-watch's :00 cron
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests markdown
      - name: Restore coin data cache
        uses: actions/cache/restore@v4
        with:
          path: seo/coin_data_cache.json
          key: coin-data-${{ github.run_id }}   # never matches on restore, forces the prefix fallback below
          restore-keys: |
            coin-data-
      - name: Refresh coin data (scheduled/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 seo/refresh_coin_data.py
      - name: Save coin data cache
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: seo/coin_data_cache.json
          key: coin-data-${{ github.run_id }}
      - name: Build site
        run: python3 deploy/landing/build.py
      - name: Guarantee .nojekyll (Jekyll bypass — ensures all .xml sitemaps are served)
        run: |
          touch deploy/landing/dist/.nojekyll
          echo "✅ .nojekyll present: $(ls -la deploy/landing/dist/.nojekyll)"
          echo "✅ sitemap count: $(ls deploy/landing/dist/sitemap*.xml 2>/dev/null | wc -l) XML files"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for CDN propagation
        run: sleep 45
      - name: Production smoke probe
        run: chmod +x scripts/check-production.sh && SITE=https://zengtrade.in ./scripts/check-production.sh
      - name: Sitemap smoke check (catches Jekyll .nojekyll regressions)
        run: |
          SITE=https://zengtrade.in
          FAIL=0
          for sm in sitemap-index.xml sitemap.xml sitemap-strategies.xml sitemap-indicators.xml sitemap-core.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/$sm")
            if [ "$code" = "200" ]; then
              echo "✅ $sm → $code"
            else
              echo "❌ $sm → $code  (FAIL — check .nojekyll in dist)"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "::error::One or more sitemaps returned non-200. Ensure .nojekyll exists in deploy/landing/dist."
            exit 1
          fi
          echo "✅ All sitemaps serving correctly"
      - name: VAPT security gate
        run: |
          SITE=https://zengtrade.in
          FAIL=0
          echo "Checking sensitive paths are NOT exposed..."
          for path in /.git/config /.git/HEAD /.env /.env.local; do
            code=$(/usr/bin/curl -s -o /dev/null -w "%{http_code}" "$SITE$path")
            if [ "$code" = "200" ]; then
              echo "❌ SECURITY FAIL: $path returned HTTP 200 (should be 404)"
              FAIL=1
            else
              echo "✅ $path → $code (blocked)"
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "::error::Sensitive path exposed. Add Cloudflare WAF rule to block /.git/* immediately."
            exit 1
          fi
          echo "✅ VAPT gate passed"
      - name: P0 gate snapshot (informational)
        run: |
          chmod +x scripts/check-migrations.sh scripts/check-worker.sh scripts/status-report.sh
          ./scripts/status-report.sh || true

