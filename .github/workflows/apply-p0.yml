name: Apply P0 (migration + paper worker)

# Founder: add DATABASE_URL or DATABASE_PASSWORD + RAILWAY_API_TOKEN to repo Secrets first.
# run-p0-if-ready.sh applies migration + worker when credentials work, then post-p0-success.sh.
# Then: Actions → Apply P0 → Run workflow → type APPLY
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to apply migration 0011 and deploy paper-worker on Railway'
        required: true
        type: string

jobs:
  p0:
    if: github.event.inputs.confirm == 'APPLY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$DATABASE_PASSWORD" ]; then
            echo "::error::Add DATABASE_URL or DATABASE_PASSWORD to repo Secrets (Supabase database password)"
            exit 1
          fi
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::Add RAILWAY_API_TOKEN to repo Secrets (railway.com/account/tokens)"
            exit 1
          fi
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Preflight database credentials
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: ./scripts/validate-database-credentials.sh
      - name: Apply P0 (migration + paper worker + post-P0 runbook)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: ./scripts/run-p0-if-ready.sh
