name: Production health watch

# Autopilot CTO: probe zengtrade.in + worker + migrations on main.
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours UTC
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production site
        run: SITE=https://zengtrade.in ./scripts/check-production.sh
      - name: Billing functions
        run: ./scripts/verify-billing.sh
      - name: Database migrations
        run: ./scripts/check-migrations.sh
      - name: Paper worker heartbeat
        run: ./scripts/check-worker.sh
      - name: Security smoke (QA&VAPT)
        run: ./scripts/security-smoke.sh
      - name: Pricing funnel truth (CBO)
        run: ./scripts/check-pricing-truth.sh
      - name: Funnel CTA utm tags (CBO)
        run: ./scripts/check-funnel-ctas.sh || echo "::warning::Funnel CTA check failed — merge latest main"
      - name: Plan intent routing (Sales)
        run: ./scripts/check-plan-intent.sh || echo "::warning::Plan-intent check failed — merge latest main"
      - name: Sitemap coin pages (CBO)
        run: ./scripts/check-sitemap.sh || echo "::warning::Sitemap missing coin URLs — merge latest main / rebuild landing"
      - name: Sync ops gate snapshot
        run: python3 scripts/sync-ops-gates.py || true

  sync-ops-data:
    needs: health
    if: github.ref == 'refs/heads/main' && always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh ops-data.json gates
        run: python3 scripts/sync-ops-gates.py || true
      - name: Commit gate snapshot if changed
        run: |
          if git diff --quiet saas/web/ops-data.json; then
            echo "ops-data.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add saas/web/ops-data.json
          git commit -m "chore(ops): auto-sync gate snapshot from health-watch"
          git push
