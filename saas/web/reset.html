<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set a new password · zengtrade</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
<link rel="stylesheet" href="/css.css">

<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px;
    background:radial-gradient(1200px 500px at 50% -10%,var(--green-soft),transparent 70%),var(--bg)}
  /* ambient aurora, matching zengtrade.in + the login page */
  .ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .aurora{position:absolute;border-radius:50%;filter:blur(55px);will-change:transform;mix-blend-mode:multiply}
  .aurora.a1{width:46vw;height:46vw;left:-8vw;top:-14vh;opacity:.4;background:radial-gradient(circle at 50% 50%,var(--green,#00AB4E),transparent 67%);animation:auroraA 30s ease-in-out infinite}
  .aurora.a2{width:38vw;height:38vw;right:-6vw;top:6vh;opacity:.26;background:radial-gradient(circle at 50% 50%,var(--green-d,#059142),transparent 70%);animation:auroraB 36s ease-in-out infinite}
  .aurora.a3{width:52vw;height:52vw;left:32vw;bottom:-26vh;opacity:.18;background:radial-gradient(circle at 50% 50%,var(--green,#00AB4E),transparent 72%);animation:auroraC 44s ease-in-out infinite}
  @keyframes auroraA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(13vw,9vh) scale(1.18)}}
  @keyframes auroraB{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-11vw,7vh) scale(.9)}}
  @keyframes auroraC{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(7vw,-9vh) scale(1.16)}}
  .grid-motion{position:absolute;inset:-60%;opacity:.07;animation:gridPan 26s linear infinite;background-image:linear-gradient(var(--green,#00AB4E) 1px,transparent 1px),linear-gradient(90deg,var(--green,#00AB4E) 1px,transparent 1px);background-size:48px 48px}
  @keyframes gridPan{from{transform:translate(0,0)}to{transform:translate(48px,48px)}}
  @media(prefers-color-scheme:dark){.aurora{mix-blend-mode:screen}.aurora.a1{opacity:.5}.grid-motion{opacity:.12}}
  @media(prefers-reduced-motion:reduce){.aurora,.grid-motion{animation:none}}
  .auth{width:100%;max-width:410px;position:relative;z-index:1}
  .brand{justify-content:center;margin-bottom:6px}
  .tag{text-align:center;color:var(--slate);font-size:13.5px;margin:0 0 22px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
  h1{font:800 20px/1.2 var(--sans);margin:0 0 5px;text-align:center;color:var(--navy)}
  .sub{color:var(--slate);font-size:13.5px;text-align:center;margin:0 0 18px;line-height:1.5}
  .pane[hidden]{display:none}
  .foot{text-align:center;color:var(--slate-2);font-size:11.5px;margin-top:18px}
  .foot a{color:var(--slate);text-decoration:none}
  form>.btn{margin-top:16px}
</style></head><body>
<div class="ambient" aria-hidden="true"><span class="aurora a1"></span><span class="aurora a2"></span><span class="aurora a3"></span><span class="grid-motion"></span></div>
<div class="auth">
  <div class="brand"><svg class="logo" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#00AB4E"/><path d="M24.69 13.67A9 9 0 1 1 20.5 8.21" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M12.5 19.5L17 15L20 17.5L26.5 8.8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>zengtrade</div>
  <p class="tag">Account recovery</p>
  <div class="card">
    <div class="pane" id="p-form">
      <h1>Choose a new password</h1>
      <p class="sub">Enter a new password for your account.</p>
      <form id="f">
        <label for="pw">New password</label>
        <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8">
        <label for="pw2">Confirm new password</label>
        <input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter it" required minlength="8">
        <button class="btn primary" type="submit">Update password</button>
      </form>
    </div>
    <div class="pane" id="p-invalid" hidden>
      <h1>Open the link from your email</h1>
      <p class="sub">This page works from the password-reset link we email you. Request a fresh one from the sign-in page.</p>
      <a href="/login" style="display:flex;justify-content:center;text-decoration:none;color:var(--navy);border:1px solid var(--line-2,var(--line));border-radius:10px;padding:12px 15px;font:700 13.5px/1 var(--sans)">Back to sign in</a>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </div>
  <p class="foot"><a href="/">← back to zengtrade.in</a></p>
</div>
<script type="module">
import { sb, niceError } from "/js/auth.js";
const $=id=>document.getElementById(id), msg=$("msg");
const show=(t,ok)=>{msg.className="msg "+(ok?"ok":"err");msg.textContent=t;};

// A recovery link lands here as .../reset#access_token=...&type=recovery. The Supabase client parses
// the URL and establishes a temporary recovery session; then updateUser({password}) sets the new one.
// We show the form optimistically and only fall back to the "use the email link" state if, after the
// client has had a moment to parse the URL, there is genuinely no recovery session.
let settled = false;
function ready() { settled = true; $("p-invalid").hidden = true; $("p-form").hidden = false; }
sb.auth.onAuthStateChange((event, session) => { if (event === "PASSWORD_RECOVERY" || session) ready(); });

setTimeout(async () => {
  if (settled) return;
  const { data: { session } } = await sb.auth.getSession();
  if (session || location.hash.includes("type=recovery")) ready();
  else { $("p-form").hidden = true; $("p-invalid").hidden = false; }
}, 1500);

$("f").onsubmit = async e => {
  e.preventDefault();
  if ($("pw").value !== $("pw2").value) return show("The two passwords don't match.");
  const b = e.target.querySelector("button"); b.disabled = true; b.textContent = "Updating…";
  try {
    const { error } = await sb.auth.updateUser({ password: $("pw").value });
    if (error) throw error;
    show("Password updated. Signing you in…", true);
    setTimeout(() => location.replace("/dashboard"), 1200);
  } catch (err) {
    show(niceError(err)); b.disabled = false; b.textContent = "Update password";
  }
};
</script></body></html>
