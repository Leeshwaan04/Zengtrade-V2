<script>
(function(){
  "use strict";
  var reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- theme toggle ------------------------------------------------------------ */
  (function(){
    var root=document.documentElement, THEME_KEY="zt_theme";
    var toggle=document.getElementById("themeToggle");
    if(!toggle) return;
    function systemDark(){ return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches; }
    function current(){
      var attr=root.getAttribute("data-theme");
      if(attr==="dark"||attr==="light") return attr;
      return systemDark() ? "dark" : "light";
    }
    function apply(theme){
      root.setAttribute("data-theme",theme);
      toggle.setAttribute("aria-pressed", theme==="dark" ? "true":"false");
      toggle.setAttribute("aria-label", theme==="dark" ? "Switch to light theme" : "Switch to dark theme");
    }
    apply(current());
    toggle.addEventListener("click",function(){
      var next = root.getAttribute("data-theme")==="dark" ? "light" : "dark";
      apply(next);
      try{ localStorage.setItem(THEME_KEY,next); }catch(e){}
    });
  })();

  /* ---- regime mascot preview -------------------------------------------------- */
  var MASCOTS={bull:"/assets/mascot-bull.png",neutral:"/assets/mascot-neutral.png",bear:"/assets/mascot-bear.png"};
  var KICKERS={bull:"Risk-on · Momentum",neutral:"Neutral · Rangebound",bear:"Risk-off · Defensive"};
  var CAPS={
    bull:"Trend has the tape, so the engine leans with it and holds longer.",
    neutral:"No edge in direction. It works the range on smaller size, or not at all.",
    bear:"Capital-preservation mode. Size comes down and exits get simple."
  };
  var SPARKS={
    bull:{d:"M2,44 L26,38 L44,40 L62,28 L80,32 L98,18 L116,22 L134,10 L152,14 L170,6 L198,4",x:198,y:4},
    neutral:{d:"M2,26 L26,20 L44,30 L62,22 L80,28 L98,20 L116,26 L134,20 L152,25 L170,20 L198,23",x:198,y:23},
    bear:{d:"M2,6 L26,12 L44,10 L62,20 L80,16 L98,28 L116,24 L134,34 L152,30 L170,40 L198,46",x:198,y:46}
  };
  var panel=document.querySelector(".mascot-panel");
  if(panel){
    var img=document.getElementById("mascotImg");
    var kicker=document.getElementById("mascotKicker");
    var cap=document.getElementById("mascotCap");
    var sparkPath=document.getElementById("sparkPath");
    var sparkDot=document.getElementById("sparkDot");
    var regimeBtns=[].slice.call(panel.querySelectorAll("[data-regime-btn]"));
    var regimeIndicator=document.getElementById("regimeIndicator");

    function replay(el){ if(!el||reduceMotion) return; el.style.animation="none"; void el.offsetWidth; el.style.animation=""; }

    function setRegime(r){
      if(!MASCOTS[r]||panel.getAttribute("data-regime")===r) return;
      panel.setAttribute("data-regime",r);
      if(img){
        var next=new Image();
        next.onload=function(){ img.src=MASCOTS[r]; img.alt=r.charAt(0).toUpperCase()+r.slice(1)+" market mascot"; replay(img); };
        next.src=MASCOTS[r];
      }
      if(kicker) kicker.textContent=KICKERS[r];
      if(cap) cap.textContent=CAPS[r];
      if(sparkPath&&sparkDot&&SPARKS[r]){
        sparkPath.setAttribute("d",SPARKS[r].d);
        sparkDot.setAttribute("cx",SPARKS[r].x);
        sparkDot.setAttribute("cy",SPARKS[r].y);
        replay(sparkPath); replay(sparkDot);
      }
      regimeBtns.forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-regime-btn")===r ? "true":"false"); });
    }

    function place(indicator, container, btn, animate){
      if(!indicator||!btn) return;
      var cRect=container.getBoundingClientRect(), bRect=btn.getBoundingClientRect();
      if(!animate||reduceMotion) indicator.style.transition="none";
      indicator.style.width=bRect.width+"px";
      indicator.style.transform="translateX("+(bRect.left-cRect.left)+"px)";
      if(!animate||reduceMotion){ void indicator.offsetWidth; indicator.style.transition=""; }
    }

    regimeBtns.forEach(function(b){
      b.addEventListener("click",function(){ setRegime(b.getAttribute("data-regime-btn")); place(regimeIndicator,panel.querySelector(".regime-seg"),b,true); });
    });

    // idle-prefetch the other two mascots, same pattern the marketing page uses
    var idle=window.requestIdleCallback||function(f){return setTimeout(f,1200);};
    idle(function(){ Object.keys(MASCOTS).forEach(function(r){ if(r==="bull") return; var i=new Image(); i.src=MASCOTS[r]; }); });

    // subtle mouse-tilt on the mascot art only, never on the floating stage or the
    // one-shot pop animation, so none of the three fight over the transform property
    var tilt=panel.querySelector(".mascot-tilt");
    if(tilt && !reduceMotion && window.matchMedia && matchMedia("(hover: hover)").matches){
      panel.addEventListener("mousemove",function(e){
        var r=panel.getBoundingClientRect();
        var px=(e.clientX-r.left)/r.width-0.5, py=(e.clientY-r.top)/r.height-0.5;
        tilt.style.transform="perspective(600px) rotateX("+(-py*10).toFixed(2)+"deg) rotateY("+(px*10).toFixed(2)+"deg)";
      });
      panel.addEventListener("mouseleave",function(){ tilt.style.transform=""; });
    }

    var regimeSeg=panel.querySelector(".regime-seg");
    var initPositions=function(){ place(regimeIndicator,regimeSeg,panel.querySelector('[data-regime-btn="bull"]'),false); };
    initPositions();
    window.addEventListener("load",initPositions);
    window.addEventListener("resize",function(){ var active=regimeBtns.filter(function(b){return b.getAttribute("aria-pressed")==="true";})[0]; place(regimeIndicator,regimeSeg,active,false); });
  }

  /* ---- sliding pill under Sign in / Create account (visual only - the auth script
     below owns aria-selected/pane switching; this just tracks which was clicked) --- */
  var tabsEl=document.querySelector(".tabs");
  var tabIndicator=document.getElementById("tabIndicator");
  if(tabsEl&&tabIndicator){
    var tIn=document.getElementById("t-in"), tUp=document.getElementById("t-up");
    function placeTab(btn,animate){
      var cRect=tabsEl.getBoundingClientRect(), bRect=btn.getBoundingClientRect();
      if(!animate||reduceMotion) tabIndicator.style.transition="none";
      tabIndicator.style.width=bRect.width+"px";
      tabIndicator.style.transform="translateX("+(bRect.left-cRect.left)+"px)";
      if(!animate||reduceMotion){ void tabIndicator.offsetWidth; tabIndicator.style.transition=""; }
    }
    if(tIn) tIn.addEventListener("click",function(){ placeTab(tIn,true); });
    if(tUp) tUp.addEventListener("click",function(){ placeTab(tUp,true); });
    var initTab=function(){ placeTab(tIn,false); };
    initTab();
    window.addEventListener("load",initTab);
    window.addEventListener("resize",function(){ placeTab(document.getElementById("t-up").getAttribute("aria-selected")==="true"?tUp:tIn,false); });
  }

  /* ---- password show/hide - a <span role=button>, never a <button>, so the auth
     script's `form.querySelector("button")` submit-button lookup can't pick it up --- */
  [].slice.call(document.querySelectorAll(".pw-toggle")).forEach(function(t){
    function toggle(){
      var input=document.getElementById(t.getAttribute("data-target"));
      if(!input) return;
      var show=input.type==="password";
      input.type=show?"text":"password";
      t.classList.toggle("is-visible",show);
      t.setAttribute("aria-label",show?"Hide password":"Show password");
    }
    t.addEventListener("click",toggle);
    t.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } });
  });
})();
</script>
<script type="module">
import { signIn, signUp, signInWithGoogle, resetPassword, establishSession, currentUser, niceError } from "/js/auth.js";
import { SITE } from "/js/config.js";
import { gaEvent } from "/js/ga.js";
const $=id=>document.getElementById(id), msg=$("msg");
const show=(t,ok)=>{msg.className="msg "+(ok?"ok":"err");msg.textContent=t;};
const busy=(b,on,txt)=>{b.disabled=on;if(txt)b.textContent=txt;};
const PENDING_SIGNUP_KEY="zt_pending_signup_complete";
const PENDING_SIGNUP_MS=7*24*60*60*1000;

function shouldTrackSignupComplete(user){
  if(!user) return false;
  try{
    const pending=localStorage.getItem(PENDING_SIGNUP_KEY);
    if(pending){
      const ts=Number(pending);
      localStorage.removeItem(PENDING_SIGNUP_KEY);
      if(!Number.isNaN(ts)&&Date.now()-ts<PENDING_SIGNUP_MS) return true;
    }
  }catch(e){}
  const created=new Date(user.created_at).getTime();
  return Date.now()-created<180000;
}

function persistCheckoutRef(ref){
  if(!ref) return;
  try{
    sessionStorage.setItem("zt_checkout_ref",ref);
    localStorage.setItem("zt_checkout_ref",ref);
  }catch(e){}
}

function maybeCheckoutRefFromUtm(){
  try{
    const utm=new URLSearchParams(location.search).get("utm_campaign");
    if(utm) persistCheckoutRef(utm);
  }catch(e){}
}

function prepOAuthSignup(){
  try{ localStorage.setItem(PENDING_SIGNUP_KEY,String(Date.now())); }catch(e){}
  maybeCheckoutRefFromUtm();
}

function trackSignupComplete(method){
  try{
    fetch("https://ponvarxeytfcntckczbn.supabase.co/rest/v1/event",{method:"POST",
      headers:{apikey:"sb_publishable_w-pQMK0bj-91EPHXtA0sMQ__CTu_rf1","Content-Type":"application/json",Prefer:"return=minimal"},
      body:JSON.stringify({name:"signup_complete",path:(location.pathname+location.search).slice(0,290)}),
      keepalive:true}).catch(()=>{});
  }catch(e){}
  gaEvent("sign_up", { method: method || "email" });
}

function goAfterAuth(user){
  const freshSignup=shouldTrackSignupComplete(user);
  if(freshSignup){
    trackSignupComplete(user?.app_metadata?.provider);
    try{ localStorage.setItem("zt_fresh_signup","1"); }catch(e){}
  }
  const pl=localStorage.getItem("zt_intent_plan");
  if(pl==="pro"||pl==="elite"){
    try{ localStorage.removeItem("zt_intent_plan"); }catch(e){}
    maybeCheckoutRefFromUtm();
    location.href=SITE.app+"#pricing";
  }else location.href=SITE.dashboard;
}

(async function boot(){
  const q=new URLSearchParams(location.search);
  if(q.get("error")) show(decodeURIComponent(q.get("error")), false);
  try{ fetch("https://ponvarxeytfcntckczbn.supabase.co/rest/v1/event",{method:"POST",
    headers:{apikey:"sb_publishable_w-pQMK0bj-91EPHXtA0sMQ__CTu_rf1","Content-Type":"application/json",Prefer:"return=minimal"},
    body:JSON.stringify({name:"signup_view",path:(location.pathname+location.search).slice(0,290),ref:(document.referrer||"").slice(0,290)}),
    keepalive:true}).catch(()=>{}); }catch(e){}
  try{
    await establishSession();
    const u=await currentUser();
    if(u) goAfterAuth(u);
    else {
      // BUG FIX (2026-09-20): completeAuthCallback() (auth.js) returns null, not a thrown error,
      // if its session poll times out without Supabase surfacing an explicit error - an expired
      // or already-used confirmation/reset link, or a slow connection. That used to leave this
      // page silently blank: no message, and ?code=/#access_token= still stuck in the address bar.
      const hadCallback=new URLSearchParams(location.search).has("code")||/access_token=|refresh_token=/.test(location.hash);
      if(hadCallback){
        show("That link expired or was already used. Request a new one below.");
        history.replaceState({}, "", location.pathname);
      }
    }
  }catch(e){ show(niceError(e)); history.replaceState({}, "", location.pathname); }
})();

$("t-in").onclick=()=>{$("t-in").ariaSelected="true";$("t-up").ariaSelected="false";$("p-in").hidden=false;$("p-up").hidden=true;msg.className="msg";};

{ const _q=new URLSearchParams(location.search);

$("f-in").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");busy(b,true,"Signing in…");
