# zengtrade: Supabase project config. Link with:
#   supabase link --project-ref ponvarxeytfcntckczbn
project_id = "ponvarxeytfcntckczbn"

[functions.nowpayments-ipn]
verify_jwt = false   # NOWPayments signs with its own HMAC-SHA512 (x-nowpayments-sig), not a Supabase JWT

[functions.nowpayments-create-invoice]
verify_jwt = false   # gateway JWT check would 401 the CORS preflight; we validate the user IN-CODE
                     # (auth.getUser on the caller's token) instead, which is equally strict.
