# fly.toml — zengtrade paper worker (Fly.io)
# Deploy: cd saas/worker && fly launch && fly secrets set DATABASE_URL=...

app = "zengtrade-worker"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  WORKER_INTERVAL = "300"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[processes]
  worker = "python worker.py --interval 300"
