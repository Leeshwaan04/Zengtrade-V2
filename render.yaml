# Render Blueprint — zengtrade paper worker
# Dashboard: New → Blueprint → connect repo → set DATABASE_URL manually.
services:
  - type: worker
    name: zengtrade-paper-worker
    runtime: docker
    dockerfilePath: ./saas/worker/Dockerfile
    dockerContext: ./saas/worker
    plan: starter
    envVars:
      - key: WORKER_INTERVAL
        value: "300"
      - key: DATABASE_URL
        sync: false
